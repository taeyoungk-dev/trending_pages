apiVersion: apps/v1
kind: Deployment
metadata:
  name: trending-pages
  labels:
    app.kubernetes.io/name: trending-pages
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trending-pages
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trending-pages
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/taeyoungk-dev/trending-pages:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: trending-pages
spec:
  selector:
    app.kubernetes.io/name: trending-pages
  ports:
    - name: http
      port: 80
      targetPort: http
